<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <img src="https://ui-avatars.com/api/?name=MF&background=ff014f&color=fff&size=50" 
                     alt="Profile" class="rounded-circle" width="50" height="50">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>

            <div class="collapse navbar-collapse" id="navbarNav">

                    <li class="nav-item"><a href="index.html" class="nav-link">HOME</a></li>

                    <li class="nav-item"><a href="resume.html" class="nav-link">RESUME</a></li>

                    <li class="nav-item"><a href="contact.html" class="nav-link">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Projects Page - py-5: padding, min-height: minimum height for content -->
    <section class="py-5" style="min-height: 80vh;">
        <div class="container">
            <!-- Page heading - text-center: center align, display-4: large heading -->
            <h1 class="text-center display-4 fw-bold mb-3">My Projects</h1>
            <p class="text-center text-muted mb-5 lead">Explore my latest work and side projects</p>
            
            <!-- Filter buttons -->
            <div class="mb-4 text-center">
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn active" data-filter="all">All</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="JavaScript">JavaScript</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="Python">Python</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="HTML">HTML</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="CSS">CSS</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="TypeScript">TypeScript</button>
                <button class="btn btn-outline-primary btn-sm mx-1 mb-2 filter-btn" data-filter="Other">Other</button>
            </div>
            
            <!-- Projects grid - row: Bootstrap grid, g-4: gap 1.5rem between cards -->
            <div id="projects-container" class="row g-4">
                <!-- Loading state - text-center: center text, py-5: padding -->
                <div class="col-12 text-center text-muted py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading projects...</p>
                </div>
            </div>
